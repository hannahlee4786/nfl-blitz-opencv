[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-blitz-reconstruction"
version = "0.1.0"
description = "Game-state reconstruction for continuous NFL Blitz clips."
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=13,<14",
  "kornia>=0.7,<0.9",
  "numpy>=1.26,<3",
  "opencv-python>=5,<6",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "scipy>=1.13,<2",
  "torch>=2.3,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
detector = ["ultralytics>=8.3,<9"]
test = ["pytest>=8,<9"]

[project.scripts]
nfl-reconstruct = "nfl_reconstruction.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

