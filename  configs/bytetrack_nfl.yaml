
# Custom ByteTrack settings for NFL Blitz 2000

tracker_type: bytetrack

# Confidence thresholds for track association
track_high_thresh: 0.35
track_low_thresh: 0.10

# Minimum confidence for starting a new track
new_track_thresh: 0.50

# Frames to retain temporarily lost tracks
track_buffer: 45

# Association threshold
match_thresh: 0.80

# Combine detection confidence with matching scores
fuse_score: True
